# Zero-setup profile backed by an in-memory H2 database.
# Run with:  mvn spring-boot:run -Dspring-boot.run.profiles=dev,h2
spring:
  datasource:
    url: jdbc:h2:mem:queueflow;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    defer-datasource-initialization: false
  h2:
    console:
      enabled: true
      path: /h2-console

queueflow:
  jwt:
    secret: queueflow-local-development-secret-change-me-32chars
  seed:
    enabled: true
