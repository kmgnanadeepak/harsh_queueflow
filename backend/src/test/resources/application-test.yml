spring:
  datasource:
    url: jdbc:h2:mem:queueflow-test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
  task:
    scheduling:
      enabled: false

queueflow:
  jwt:
    secret: queueflow-test-secret-value-at-least-32-chars
    issuer: queueflow-test
    expiration: 30m
  frontend:
    url: http://localhost:5173
    oauth-callback-path: /auth/callback
    allowed-origins: http://localhost:5173
  google:
    client-id: ""
    client-secret: ""
  seed:
    enabled: false
  queue:
    ageing-interval-minutes: 15
    ageing-max-boost: 2
    approaching-threshold: 2
    approaching-scan-interval-ms: 3600000

logging:
  level:
    root: WARN
    com.harsha.queueflow: INFO
    org.springframework.web: WARN
